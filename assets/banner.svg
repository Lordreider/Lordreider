<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="t d">
  <title id="t">Lordreider</title>
  <desc id="d">Discord Bot &amp; Web Developer</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0c2a3d"/>
      <stop offset="1" stop-color="#0e4a5f"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D8FF"/>
      <stop offset="1" stop-color="#4ECDC4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00D8FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00D8FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#67e8f9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="260" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <ellipse cx="200" cy="130" rx="260" ry="140" fill="url(#glow)">
      <animate attributeName="cx" values="200;800;200" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <text x="880" y="190" font-family="Consolas, Menlo, monospace" font-size="170" font-weight="700" fill="#67e8f9" fill-opacity="0.06" text-anchor="middle">&lt;/&gt;</text>
    <text x="120" y="110" font-family="Consolas, Menlo, monospace" font-size="120" font-weight="700" fill="#67e8f9" fill-opacity="0.05" text-anchor="middle">{ }</text>

    <text x="500" y="128" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="2" fill="url(#txt)" opacity="0">
      Lordreider
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="176" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1" opacity="0">
      Discord Bot &amp; Web Developer
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="212" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" letter-spacing="1" fill="#67e8f9" opacity="0">
      Lordreider Systems  ·  Averge.eu
      <animate attributeName="opacity" from="0" to="0.9" begin="1.2s" dur="1.2s" fill="freeze"/>
    </text>

    <rect x="400" y="228" width="200" height="3" rx="1.5" fill="url(#txt)" opacity="0.8"/>
  </g>
</svg>
